# 뉴스 → Supabase trend_signals 수집을 Render 서버 없이 직접 실행합니다.
# 매시간 예약 실행 + 수동 실행. cron은 UTC 기준이며, GitHub 부하가 몰리는
# 정각을 피해 매시 7분에 실행합니다(KST도 매시 7분). cron-job.org 뉴스 작업은
# 꺼둔 상태여야 합니다 - 두 경로가 동시에 돌면 같은 기사를 중복 집계할 수 있음.
name: News signals collection

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # server/database.js가 node:sqlite를 import하므로 22.13 이상이 필요합니다.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Collect news signals
        run: node scripts/collect-news-signals.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
