# 4-1단계: Render Node 웹 서비스 설정(free 플랜).
# 4-2단계: buildCommand에 "npm run build"를 추가해서 배포 시 React 프론트
# 엔드도 dist/로 빌드되게 했습니다 - server/server.js가 dist/index.html
# 존재 여부로 정적 서빙을 자동 판단하므로, 이 한 줄 추가만으로 API+프론트
# 모두 이 한 서비스에서 서빙됩니다(로컬 개발 흐름은 그대로 영향 없음).
#
# free 플랜은 idle 시 프로세스가 내려갔다가 요청이 와야 재기동되는
# spin-down 환경입니다 - server/scheduler.js, server/server.js의 관련
# 주석에 설명된 대로 setInterval 기반 스케줄러(SCHEDULER_ENABLED)는 이런
# 환경에서 신뢰할 수 없으므로, 아래 SCHEDULER_ENABLED는 명시적으로 "false"로
# 고정하고, 대신 외부 크론 서비스가 POST /api/scheduler/trigger를
# 주기적으로 호출하는 방식을 씁니다(SCHEDULER_SECRET은 값을 비워뒀으니
# Render 대시보드에서 직접 채워야 합니다 - 이 파일에는 시크릿 값을 넣지
# 않습니다).
services:
  - type: web
    name: whats-trend-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TRENDS_API_ENDPOINT
        sync: false
      - key: GOOGLE_TRENDS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_SECRET
        sync: false
      # Phase A: Vite는 빌드 시점(buildCommand)에 VITE_ 접두사 변수를
      # 번들에 값으로 박아 넣습니다 - 런타임(startCommand)이 아니라 빌드
      # 시점에 존재해야 하므로, 값을 채운 뒤에는 반드시 재배포(재빌드)해야
      # 반영됩니다. anon/public 키라 SUPABASE_SERVICE_ROLE_KEY와 달리
      # 브라우저에 노출돼도 안전하지만, 실수로 service_role 키를 여기
      # 넣지 않도록 주의하세요.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Phase D: 토스페이먼츠 자동결제(빌링). TOSS_CLIENT_KEY(서버)/
      # VITE_TOSS_CLIENT_KEY(브라우저 SDK, 빌드 시점에 번들에 박힘)는
      # 같은 "API 개별 연동 키" 값이고, TOSS_SECRET_KEY는 서버 전용입니다.
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: VITE_TOSS_CLIENT_KEY
        sync: false
      # SCHEDULER_SECRET과 독립적인 별도 시크릿 - 결제 재청구 트리거 전용.
      - key: SUBSCRIPTION_RENEWAL_SECRET
        sync: false
